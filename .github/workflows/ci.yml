name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    # macOS-first project; the audio backend will be CoreAudio-only for now.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      # The allocation trap only proves anything when it actually runs. Once the
      # offline harness exists this step drives it with assert_no_alloc active,
      # so an allocation on the audio thread fails the build rather than
      # surfacing as an intermittent click in the field.
      - name: Real-time safety harness
        run: echo "not yet implemented - see analyzer-engine"
