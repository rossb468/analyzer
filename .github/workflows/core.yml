name: Core

# The whole core, on the three platforms it has to build on. It is meant to be
# buildable and testable without an audio stack, a window server or an Apple
# SDK, and the only way that claim stays true is if a machine checks it on
# every push. Linux is where it breaks first, because it has none of the three.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'third_party/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'check.sh'
      - '.clang-format'
      - '.github/workflows/core.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'third_party/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'check.sh'
      - '.clang-format'
      - '.github/workflows/core.yml'
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the others: a compile error on
      # Linux and a test failure on Windows are different problems and both are
      # worth seeing in the same run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # Formatting is platform-independent, so checking it once is enough.
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: |
          find src tests -name '*.hpp' -o -name '*.cpp' -o -name '*.mm' \
            | xargs clang-format --dry-run --Werror

      # MSVC's warning set differs enough from GCC and Clang that it is not yet
      # held to zero; it is built and tested, with warnings shown.
      - name: Configure
        shell: bash
        run: |
          werror=ON
          [[ "${{ matrix.os }}" == windows-latest ]] && werror=OFF
          # The oldest macOS the app supports. Apple's libc++ hides APIs newer
          # than the deployment target, so building for the runner's own
          # version would accept code the app cannot compile.
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DANALYZER_WERROR=$werror \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0

      - name: Build
        run: cmake --build build --config Debug --parallel

      # The suite includes the allocation trap's own tests, so a debug build
      # here also proves the audio callback paths do not allocate.
      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure --parallel 4

      # A known-answer check on the whole chain: an on-bin sine at half scale
      # must read -6.02 dBFS. Catches an FFT scaling, window correction or dBFS
      # reference error that unit tests could all individually pass through.
      # Bash on every runner, Windows included, so this is written once.
      - name: Known-answer level check
        shell: bash
        run: |
          cli=build/src/cli/analyzer-cli
          [[ -x "$cli" ]] || cli=build/src/cli/Debug/analyzer-cli.exe
          level=$("$cli" --sine 996.09375 --amplitude 0.5 --seconds 1 --window flattop --peak \
            | grep -v '^#' | cut -f2)
          echo "measured: $level dBFS (expected -6.0206)"
          awk -v got="$level" 'BEGIN { exit (got - -6.0206 < 0.02 && got - -6.0206 > -0.02) ? 0 : 1 }'

      # The library the iPhone app links, cross-compiled for its oldest
      # supported iOS. The only place the core's Objective-C++ audio backend is
      # compiled before the app's own CI sees it.
      - name: Build for iOS
        if: matrix.os == 'macos-latest'
        run: |
          cmake -S . -B build-ios -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY -DANALYZER_BUILD_TESTS=OFF
          cmake --build build-ios --target analyzer_bundle --parallel

      # Optimised builds see warnings that Debug builds do not, because GCC
      # runs some analyses only after inlining.
      - name: Build and test Release
        if: matrix.os == 'ubuntu-latest'
        run: |
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release --parallel
          ctest --test-dir build-release --output-on-failure --parallel 4

      # AddressSanitizer and UndefinedBehaviorSanitizer over the whole suite.
      # Rust ruled out most of what these catch at compile time; C++ needs them
      # to run.
      - name: Test under ASan and UBSan
        if: matrix.os == 'ubuntu-latest'
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DANALYZER_SANITIZE=address
          cmake --build build-asan --parallel
          ctest --test-dir build-asan --output-on-failure --parallel 4

      # ThreadSanitizer over the suite: the ring, the triple buffer and the
      # engine's worker are where a missing memory order would hide.
      - name: Test under TSan
        if: matrix.os == 'ubuntu-latest'
        run: |
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DANALYZER_SANITIZE=thread
          cmake --build build-tsan --parallel
          ctest --test-dir build-tsan --output-on-failure --parallel 4
