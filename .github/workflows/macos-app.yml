name: macOS app

# The platform half: the C ABI and the Swift application above it.
#
# Separate from the core workflow because it can only ever run on one platform,
# and because keeping it separate is what makes the boundary visible. If a
# change to crates/analyzer-dsp starts requiring this workflow to pass, the
# layering has been broken.
on:
  push:
    branches: [main]
    paths:
      - 'apps/macos/**'
      - 'crates/analyzer-ffi/**'
      - '.github/workflows/macos-app.yml'
  pull_request:
    paths:
      - 'apps/macos/**'
      - 'crates/analyzer-ffi/**'
      - '.github/workflows/macos-app.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-app

      - name: Clippy the FFI
        run: cargo clippy --all-targets --all-features -p analyzer-ffi

      - name: Test the FFI
        run: cargo test --all-features -p analyzer-ffi

      # Builds the staticlib, generates the header through cbindgen, compiles
      # every Swift source against it and lays out the bundle. Catches a change
      # to the C ABI that the Rust side is perfectly happy with and Swift is not
      # - which is most of them, since cbindgen regenerates the header silently.
      - name: Build the app
        run: ./apps/macos/build.sh

      # A bundle that builds and cannot launch is not a passing build. This is
      # as far as CI can go: there is no display, so the window never appears
      # and nothing about the interface itself is verified here.
      - name: Launch
        run: |
          open apps/macos/build/Analyzer.app
          sleep 10
          if pgrep -f "Analyzer.app/Contents/MacOS/Analyzer" > /dev/null; then
            echo "launched and still running"
            osascript -e 'quit app "Analyzer"' || true
          else
            echo "the app exited within 10 seconds of launching" >&2
            ls -t ~/Library/Logs/DiagnosticReports/Analyzer* 2>/dev/null | head -1 | xargs -r cat
            exit 1
          fi
