language = "C"
include_guard = "ANALYZER_H"
autogen_warning = """
/* Generated by cbindgen from analyzer-ffi. Do not edit by hand.
 * Regenerated on every build of that crate; it is not committed. */
"""
documentation = true
documentation_style = "doxy"
cpp_compat = true

[export]
prefix = ""

[enum]
prefix_with_name = true
