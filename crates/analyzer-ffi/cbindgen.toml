language = "C"
include_guard = "ANALYZER_H"
autogen_warning = """
/* Generated by cbindgen from analyzer-ffi. Do not edit by hand.
 * Regenerated on every build of that crate; it is not committed. */
"""
documentation = true
documentation_style = "doxy"
# Off: with it on, cbindgen emits both `enum X` and `typedef uint32_t X`, and
# Swift's clang importer sees two candidates for the same name. Swift imports C.
cpp_compat = false

[export]
prefix = ""

[enum]
prefix_with_name = true
