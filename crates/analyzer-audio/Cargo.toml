[package]
name = "analyzer-audio"
description = "Audio device abstraction and platform backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = { workspace = true }
coreaudio-sys = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true }
objc2-audio-toolbox = { workspace = true, features = [
    "std",
    "AUComponent",
    "AudioComponent",
    "AudioOutputUnit",
    "AudioUnitProperties",
    "objc2-core-audio-types",
] }
objc2-avf-audio = { workspace = true, features = [
    "std",
    "AVAudioSession",
    "AVAudioSessionRoute",
    "AVAudioSessionTypes",
] }
objc2-core-audio-types = { workspace = true, features = ["std", "CoreAudioBaseTypes"] }
objc2-foundation = { workspace = true, features = ["std", "NSArray", "NSEnumerator", "NSError", "NSString"] }
